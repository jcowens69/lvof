# The Next.js site lives in /web. Netlify auto-detects Next.js and installs its runtime.
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Make sure Netlify's Next.js runtime is always applied (serves pages, images and API routes).
[[plugins]]
  package = "@netlify/plugin-nextjs"
